<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetaPak AI Teknik Asistan</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        #chat-box { height: 400px; border: 1px solid #ddd; border-radius: 5px; padding: 10px; overflow-y: scroll; margin-bottom: 10px; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .bot { background: #e9ecef; color: #333; align-self: flex-start; white-space: pre-wrap; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>BetaPak AI Teknik Asistan</h2>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Arıza kodu veya soru yazın..." onkeypress="handleKey(event)">
            <button onclick="soruGonder()">Gönder</button>
        </div>
    </div>

    <script>
        async function soruGonder() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const soru = inputField.value.trim();
            if (!soru) return;

            // Kullanıcı mesajı
            chatBox.innerHTML += `<div class="message user">${soru}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yükleniyor mesajı
            const loadingId = "loading_" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message bot">Yapay zeka düşünüyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/soru-sor", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ soru: soru })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                if (response.ok) {
                    chatBox.innerHTML += `<div class="message bot">${data.cevap}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message bot">Hata: ${data.detail || "Bilinmeyen hata"}</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot">Bağlantı hatası oluştu.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === "Enter") soruGonder();
        }
    </script>
</body>
</html>
